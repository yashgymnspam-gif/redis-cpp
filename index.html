<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Redis Server — Live Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Berkeley+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f0e;--surface:#131513;--surface2:#191c19;--border:#252825;
  --green:#4ade80;--green2:#22c55e;--green3:#166534;
  --amber:#fbbf24;--red:#f87171;--blue:#60a5fa;--purple:#c084fc;
  --text:#dde8da;--dim:#5a6657;--mid:#8a9987;
  --mono:'Berkeley Mono',monospace;--ui:'DM Sans',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;overflow:hidden}

/* layout */
.shell{display:flex;flex-direction:column;height:100vh}
.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 18px;height:42px;display:flex;align-items:center;gap:12px;flex-shrink:0
}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;cursor:default}
.dot.r{background:#f87171}.dot.y{background:#fbbf24}.dot.g{background:#4ade80}
.bar-title{font-family:var(--ui);font-size:13px;color:var(--mid);font-weight:400;margin-left:4px}
.bar-title strong{color:var(--text);font-weight:500}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.conn-badge{display:flex;align-items:center;gap:6px;font-size:12px;font-family:var(--ui)}
.conn-dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.conn-dot.on{background:var(--green);animation:blink 2.5s infinite}
.conn-label{color:var(--mid)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

.body{display:flex;flex:1;overflow:hidden}

/* sidebar */
.sidebar{width:210px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sb-head{padding:10px 14px;font-size:10px;letter-spacing:.1em;color:var(--dim);font-family:var(--ui);font-weight:500;text-transform:uppercase;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sb-count{background:var(--surface2);color:var(--mid);font-size:10px;padding:1px 7px;border-radius:10px;font-family:var(--mono)}
.kv-scroll{flex:1;overflow-y:auto}
.kv-scroll::-webkit-scrollbar{width:3px}
.kv-scroll::-webkit-scrollbar-thumb{background:var(--border)}
.kv-item{padding:8px 14px;border-bottom:1px solid var(--border);cursor:default;transition:background .1s}
.kv-item:hover{background:var(--surface2)}
.kv-key{color:var(--amber);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv-val{color:var(--mid);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.kv-ttl{font-size:10px;color:var(--red);margin-top:3px;display:flex;align-items:center;gap:4px}
.ttl-bar-wrap{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.ttl-bar{height:100%;background:var(--red);border-radius:2px;transition:width 1s linear}
.kv-empty{padding:20px 14px;font-size:12px;color:var(--dim);font-family:var(--ui);font-style:italic}

/* terminal */
.terminal{flex:1;display:flex;flex-direction:column;overflow:hidden}
.output{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:1px}
.output::-webkit-scrollbar{width:4px}
.output::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.line{line-height:1.65;font-size:13px;animation:fi .12s ease}
@keyframes fi{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.line.prompt-line .ps1{color:var(--green);margin-right:8px}
.line.prompt-line .raw{color:var(--text)}
.line.ok{color:var(--green)}
.line.err{color:var(--red)}
.line.int{color:var(--blue)}
.line.nil{color:var(--dim);font-style:italic}
.line.bulk{color:var(--green)}
.line.arr-item .idx{color:var(--dim);margin-right:8px}
.line.arr-item .val{color:var(--amber)}
.line.resp-raw{
  font-size:11px;color:var(--dim);margin-top:1px;margin-bottom:6px;
  padding:5px 10px;background:var(--surface2);border-radius:4px;
  border-left:2px solid var(--border);font-family:var(--mono)
}
.line.resp-raw .rn{color:var(--border)}
.line.info{color:var(--dim);font-size:12px;font-family:var(--ui);font-style:italic}
.line.sys{color:var(--purple);font-size:12px}
.divider{border:none;border-top:1px solid var(--border);margin:8px 0}

/* input */
.input-area{border-top:1px solid var(--border);background:var(--surface);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.ps1-static{color:var(--green);white-space:nowrap;font-size:13px}
#cmdinput{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--text);font-family:var(--mono);font-size:13px;caret-color:var(--green)
}
#cmdinput::placeholder{color:var(--dim)}
#cmdinput:disabled{opacity:.4;cursor:not-allowed}

/* hint bar */
.hints{padding:6px 18px;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap;flex-shrink:0}
.hint{font-size:11px;color:var(--dim);font-family:var(--ui)}
.hint code{color:var(--mid);font-family:var(--mono)}
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <div class="dots">
      <div class="dot r"></div>
      <div class="dot y"></div>
      <div class="dot g"></div>
    </div>
    <div class="bar-title">redis-cli &mdash; <strong>your C++ server</strong> &mdash; 127.0.0.1:6379</div>
    <div class="bar-right">
      <div class="conn-badge">
        <div class="conn-dot" id="conndot"></div>
        <span class="conn-label" id="connlabel">disconnected</span>
      </div>
    </div>
  </div>

  <div class="body">
    <div class="sidebar">
      <div class="sb-head">
        key store
        <span class="sb-count" id="keycount">0</span>
      </div>
      <div class="kv-scroll" id="kvlist">
        <div class="kv-empty">empty</div>
      </div>
    </div>

    <div class="terminal">
      <div class="output" id="output"></div>
      <div class="input-area">
        <span class="ps1-static">127.0.0.1:6379&gt;</span>
        <input id="cmdinput" placeholder="type a command…" autocomplete="off" autocorrect="off" spellcheck="false" disabled/>
      </div>
      <div class="hints">
        <div class="hint"><code>PING</code></div>
        <div class="hint"><code>SET</code> key val</div>
        <div class="hint"><code>GET</code> key</div>
        <div class="hint"><code>DEL</code> key</div>
        <div class="hint"><code>EXISTS</code> key</div>
        <div class="hint"><code>KEYS *</code></div>
        <div class="hint"><code>EXPIRE</code> key sec</div>
        <div class="hint"><code>TTL</code> key</div>
        <div class="hint"><code>INCR</code> key</div>
        <div class="hint"><code>MSET</code> k v k v</div>
        <div class="hint"><code>APPEND</code> key val</div>
        <div class="hint"><code>clear</code></div>
      </div>
    </div>
  </div>
</div>

<script>
const output   = document.getElementById('output');
const input    = document.getElementById('cmdinput');
const kvlist   = document.getElementById('kvlist');
const keycount = document.getElementById('keycount');
const conndot  = document.getElementById('conndot');
const connlbl  = document.getElementById('connlabel');

/* ── local mirror of store (rebuilt from responses) ── */
const mirror = {};   // key → { val, expireAt (ms epoch) | null }
const cmdHistory = [];
let histIdx = -1;
let ws = null;
let pendingCmd = null;
let buffer = '';

/* ── silent sync queue (runs on connect, invisible to terminal) ── */
let syncQueue = [];     // array of RESP strings to send silently
let syncHandlers = [];  // parallel array of callbacks that handle each response
let syncing = false;

function syncSend(resp, handler) {
  syncQueue.push(resp);
  syncHandlers.push(handler);
}

function runSync() {
  if (syncQueue.length === 0) { syncing = false; return; }
  syncing = true;
  const resp = syncQueue.shift();
  const handler = syncHandlers.shift();
  currentSyncHandler = handler;
  ws.send(resp);
}

let currentSyncHandler = null;

function autoSync() {
  /* 1. fetch all keys */
  syncSend(buildRESP(['KEYS', '*']), (parsed) => {
    if (parsed.type !== 'array' || !parsed.val.length) return;
    const keys = parsed.val;
    /* 2. for each key, GET value and TTL */
    keys.forEach(k => {
      syncSend(buildRESP(['GET', k]), (r) => {
        if (r.type === 'bulk') {
          if (!mirror[k]) mirror[k] = { val: r.val, expireAt: null };
          else mirror[k].val = r.val;
        }
        updateSidebar();
      });
      syncSend(buildRESP(['TTL', k]), (r) => {
        if (r.type === 'int' && r.val >= 0) {
          if (!mirror[k]) mirror[k] = { val: '…', expireAt: null };
          mirror[k].expireAt = Date.now() + r.val * 1000;
        }
        updateSidebar();
      });
    });
  });
  runSync();
}

/* ── WebSocket ── */
function connect() {
  ws = new WebSocket('ws://localhost:8080');

  ws.onopen = () => {
    setConn(true);
    addLine('sys', '● connected to C++ server via bridge');
    addLine('info', 'Every command hits your actual server — responses are real RESP');
    addLine('info', 'Syncing key store…');
    addHR();
    input.disabled = false;
    input.focus();
    autoSync();
  };

  ws.onclose = () => {
    setConn(false);
    input.disabled = true;
    syncing = false; syncQueue = []; syncHandlers = []; currentSyncHandler = null;
    addLine('err', '● disconnected. Is the bridge running?  node bridge.js');
    setTimeout(connect, 3000);
  };

  ws.onerror = () => {
    setConn(false);
  };

  ws.onmessage = (e) => {
    buffer += e.data;
    const parsed = tryParseRESP(buffer);
    if (parsed === null) return;
    buffer = '';

    /* if a silent sync response is expected, handle it invisibly */
    if (currentSyncHandler) {
      const h = currentSyncHandler;
      currentSyncHandler = null;
      h(parsed);
      runSync();
      return;
    }

    /* normal user command response */
    const cmd = pendingCmd;
    pendingCmd = null;
    renderResponse(parsed, cmd);
    syncMirror(parsed, cmd);
    updateSidebar();
  };
}

function setConn(on) {
  conndot.className = 'conn-dot' + (on ? ' on' : '');
  connlbl.textContent = on ? 'connected · port 6379' : 'disconnected';
}

/* ── RESP parser ── */
function tryParseRESP(raw) {
  if (!raw) return null;
  const lines = raw.split('\r\n');
  if (lines.length < 2) return null;

  const first = lines[0];
  if (!first) return null;

  const type = first[0];
  const rest = first.slice(1);

  if (type === '+') return { type: 'simple', val: rest, raw };
  if (type === '-') return { type: 'error',  val: rest, raw };
  if (type === ':') return { type: 'int',    val: parseInt(rest), raw };
  if (type === '$') {
    const len = parseInt(rest);
    if (len === -1) return { type: 'null', raw };
    if (lines.length < 3) return null;
    return { type: 'bulk', val: lines[1], raw };
  }
  if (type === '*') {
    const count = parseInt(rest);
    if (count === 0) return { type: 'array', val: [], raw };
    const items = [];
    let i = 1;
    while (items.length < count && i < lines.length - 1) {
      if (lines[i].startsWith('$')) { i++; items.push(lines[i]); i++; }
      else i++;
    }
    if (items.length < count) return null;
    return { type: 'array', val: items, raw };
  }
  return { type: 'unknown', val: raw, raw };
}

/* ── build RESP to send ── */
function buildRESP(parts) {
  let s = '*' + parts.length + '\r\n';
  for (const p of parts) s += '$' + p.length + '\r\n' + p + '\r\n';
  return s;
}

/* ── parse quoted command line ── */
function parseArgs(raw) {
  const args = [];
  let cur = '', inQ = false, q = '';
  for (let i = 0; i < raw.length; i++) {
    const c = raw[i];
    if (!inQ && (c === '"' || c === "'")) { inQ = true; q = c; }
    else if (inQ && c === q) inQ = false;
    else if (!inQ && c === ' ') { if (cur) { args.push(cur); cur = ''; } }
    else cur += c;
  }
  if (cur) args.push(cur);
  return args;
}

/* ── send command ── */
function send(raw) {
  raw = raw.trim();
  if (!raw) return;
  cmdHistory.unshift(raw);
  histIdx = -1;

  if (raw.toLowerCase() === 'clear') {
    output.innerHTML = '';
    addLine('sys', '● terminal cleared');
    return;
  }

  addLine('prompt-line', `<span class="ps1">127.0.0.1:6379&gt;</span><span class="raw"> ${esc(raw)}</span>`);

  const parts = parseArgs(raw);
  if (!parts.length) return;

  pendingCmd = parts;
  const resp = buildRESP(parts);
  ws.send(resp);
}

/* ── render server response ── */
function renderResponse(parsed, cmd) {
  const respEscaped = esc(parsed.raw)
    .replace(/\\r\\n/g, '<span class="rn">\\r\\n</span>')
    .replace(/\r\n/g,   '<span class="rn">\\r\\n</span>');

  if (parsed.type === 'simple') {
    addLine('ok', esc(parsed.val));
  } else if (parsed.type === 'error') {
    addLine('err', '(error) ' + esc(parsed.val));
  } else if (parsed.type === 'int') {
    addLine('int', '(integer) ' + parsed.val);
  } else if (parsed.type === 'null') {
    addLine('nil', '(nil)');
  } else if (parsed.type === 'bulk') {
    addLine('bulk', '"' + esc(parsed.val) + '"');
  } else if (parsed.type === 'array') {
    if (!parsed.val.length) { addLine('nil', '(empty array)'); }
    else parsed.val.forEach((v, i) => {
      const d = document.createElement('div');
      d.className = 'line arr-item';
      d.innerHTML = `<span class="idx">${i + 1})</span><span class="val">${esc(v)}</span>`;
      output.appendChild(d);
    });
  }

  /* show raw RESP bytes */
  addLine('resp-raw', respEscaped);
  output.scrollTop = output.scrollHeight;
}

/* ── sync local mirror from command + response ── */
function syncMirror(parsed, pendingCmd) {
  if (!pendingCmd) return;
  const cmd = (pendingCmd[0] || '').toUpperCase();

  if (cmd === 'SET' && parsed.type === 'simple' && parsed.val === 'OK') {
    mirror[pendingCmd[1]] = { val: pendingCmd[2], expireAt: null };
  }
  if (cmd === 'MSET' && parsed.type === 'simple') {
    for (let i = 1; i < pendingCmd.length; i += 2)
      mirror[pendingCmd[i]] = { val: pendingCmd[i+1], expireAt: null };
  }
  if (cmd === 'DEL') {
    for (let i = 1; i < pendingCmd.length; i++) delete mirror[pendingCmd[i]];
  }
  if (cmd === 'GET' && parsed.type === 'null') delete mirror[pendingCmd[1]];
  if (cmd === 'GET' && parsed.type === 'bulk') {
    if (!mirror[pendingCmd[1]]) mirror[pendingCmd[1]] = { val: parsed.val, expireAt: null };
    else mirror[pendingCmd[1]].val = parsed.val;
  }
  if (cmd === 'EXPIRE' && parsed.type === 'int' && parsed.val === 1) {
    const secs = parseInt(pendingCmd[2]);
    if (mirror[pendingCmd[1]]) mirror[pendingCmd[1]].expireAt = Date.now() + secs * 1000;
  }
  if (cmd === 'INCR' && parsed.type === 'int') {
    mirror[pendingCmd[1]] = { val: String(parsed.val), expireAt: mirror[pendingCmd[1]]?.expireAt || null };
  }
  if (cmd === 'APPEND' && parsed.type === 'int') {
    syncSend(buildRESP(['GET',pendingCmd[1]]),(r)=>
  {
    if (r.type === 'bulk'){
      if(!mirror[pendingCmd[1]]) mirror[pendingCmd[1]] = { val: r.val, expireAt:null};
      else mirror[pendingCmd[1]].val = r.val;
      updateSidebar()
    }
  });
  runSync();
  }
  if (cmd === 'FLUSHALL') Object.keys(mirror).forEach(k => delete mirror[k]);
  if (cmd === 'TTL' && parsed.type === 'int') {
    if (parsed.val === -2) delete mirror[pendingCmd[1]];
  }
}

/* ── sidebar ── */
function updateSidebar() {
  const now = Date.now();
  const entries = Object.entries(mirror).filter(([, v]) => {
    if (v.expireAt && now > v.expireAt) { delete mirror[Object.keys(mirror).find(k => mirror[k] === v)]; return false; }
    return true;
  });

  keycount.textContent = entries.length;

  if (!entries.length) {
    kvlist.innerHTML = '<div class="kv-empty">empty</div>';
    return;
  }

  kvlist.innerHTML = entries.map(([k, v]) => {
    let ttlHtml = '';
    if (v.expireAt) {
      const rem = Math.max(0, Math.ceil((v.expireAt - now) / 1000));
      const total = Math.max(rem, 1);
      const pct = Math.round((rem / total) * 100);
      ttlHtml = `<div class="kv-ttl">
        TTL ${rem}s
        <div class="ttl-bar-wrap"><div class="ttl-bar" style="width:${pct}%"></div></div>
      </div>`;
    }
    return `<div class="kv-item">
      <div class="kv-key">${esc(k)}</div>
      <div class="kv-val">${esc(v.val)}</div>
      ${ttlHtml}
    </div>`;
  }).join('');
}

setInterval(updateSidebar, 500);

/* ── DOM helpers ── */
function addLine(cls, html) {
  const d = document.createElement('div');
  d.className = 'line ' + cls;
  d.innerHTML = html;
  output.appendChild(d);
}
function addHR() {
  output.appendChild(Object.assign(document.createElement('hr'), { className: 'divider' }));
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── input handling ── */
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') { send(input.value); input.value = ''; }
  else if (e.key === 'ArrowUp') {
    if (cmdHistory[histIdx + 1] !== undefined) { histIdx++; input.value = cmdHistory[histIdx]; }
    e.preventDefault();
  }
  else if (e.key === 'ArrowDown') {
    histIdx = Math.max(-1, histIdx - 1);
    input.value = histIdx >= 0 ? cmdHistory[histIdx] : '';
    e.preventDefault();
  }
});

document.querySelector('.shell').addEventListener('click', () => input.focus());

/* ── boot ── */
addLine('info', 'Connecting to bridge on ws://localhost:8080…');
connect();
</script>
</body>
</html>
